subprojects {
    plugins.withType(JavaPlugin).configureEach {
        def profile = rootProject.projectDir.name
        tasks.withType(Jar).configureEach { from(rootProject.file('../LICENSE')) }

        sourceSets.main.java.srcDir rootProject.file('../shared/core')
        sourceSets.main.resources.srcDir rootProject.file('../shared/resources')
        sourceSets.test.java.srcDir rootProject.file('../shared/test')

        if (profile != '1.20.1') {
            sourceSets.main.java.srcDir rootProject.file('../shared/modern')
            sourceSets.main.resources.srcDir rootProject.file('../shared/resources-modern')
        }

        if (project.name == 'fabric') {
            def modmenuStub = sourceSets.create('modmenuStub')
            modmenuStub.java.srcDir rootProject.file('../shared/modmenu-stub')
            afterEvaluate {
                modmenuStub.compileClasspath += sourceSets.main.compileClasspath
                sourceSets.main.compileClasspath += modmenuStub.output
                tasks.named('compileJava').configure {
                    dependsOn tasks.named('compileModmenuStubJava')
                }
            }
        }

        afterEvaluate {
            def findArchiveTask = { String name ->
                def t = tasks.findByName(name)
                return (t instanceof AbstractArchiveTask) ? t : null
            }
            def deliverableTask = findArchiveTask('remapJar')
                ?: findArchiveTask('jarJar')
                ?: findArchiveTask('jar')
            if (deliverableTask != null && tasks.findByName('test') != null) {
                def sourceDirsArg = sourceSets.main.java.srcDirs
                    .collect { it.absolutePath }
                    .join(File.pathSeparator)
                def deliverablePath = deliverableTask.archiveFile.get().asFile.absolutePath
                tasks.named('test', Test).configure {
                    dependsOn(deliverableTask)
                    systemProperty 'paperplane.jar', deliverablePath
                    systemProperty 'paperplane.sourceDirs', sourceDirsArg
                }
            }
        }
    }
}

name: CI

on:
  push:
    branches: [main, 'rework/**']
  pull_request:

jobs:
  build-matrix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: '1.20.1'
            java: '21'
          - minecraft: '1.21.1'
            java: '21'
          - minecraft: '26.1.2'
            java: '25'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: matrix.minecraft == '1.20.1'
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Export JAVA_<ver>_HOME
        shell: bash
        run: |
          if [ -n "${JAVA_HOME_17_X64:-}" ]; then echo "JAVA_17_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"; fi
          if [ -n "${JAVA_HOME_21_X64:-}" ]; then echo "JAVA_21_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"; fi
          if [ -n "${JAVA_HOME_25_X64:-}" ]; then echo "JAVA_25_HOME=$JAVA_HOME_25_X64" >> "$GITHUB_ENV"; fi
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and verify ${{ matrix.minecraft }}
        run: python3 scripts/build-matrix.py --minecraft ${{ matrix.minecraft }} --skip-py-tests

  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run Python contract tests
        run: python3 -m unittest discover -s tests -v

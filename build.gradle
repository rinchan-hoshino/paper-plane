plugins {
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT' apply false
    id 'net.neoforged.moddev' version '2.0.141' apply false
}

subprojects {
    group = rootProject.mod_group_id
    version = rootProject.mod_version

    repositories {
        mavenLocal()
        mavenCentral()
        maven { url = 'https://maven.neoforged.net/releases' }
        exclusiveContent {
            forRepository { maven { url = 'https://maven.fabricmc.net/' } }
            filter { includeGroupByRegex 'net\\.fabricmc(\\..*)?' }
        }
        exclusiveContent {
            forRepository { maven { url = 'https://maven.ftb.dev/releases' } }
            filter { includeGroup 'dev.ftb.mods' }
        }
        exclusiveContent {
            forRepository { maven { url = 'https://maven.architectury.dev/' } }
            filter { includeGroup 'dev.architectury' }
        }
        maven { url = 'https://cursemaven.com' }
        exclusiveContent {
            forRepository { maven { url = 'https://api.modrinth.com/maven' } }
            filter { includeGroup 'maven.modrinth' }
        }
    }

    plugins.withType(JavaPlugin).configureEach {
        java.toolchain.languageVersion = JavaLanguageVersion.of(rootProject.java_version as int)
        tasks.withType(JavaCompile).configureEach {
            options.encoding = 'UTF-8'
        }
    }
}

plugins {
    id 'fabric-loom' version '1.11.8' apply false
}

ext.profiles = [
    '1.20.1': [
        javaVersion        : 17,
        minecraftRange     : '[1.20.1,1.20.2)',
        forgeVersion       : '47.4.23',
        forgeRange         : '[47.4.0,48)',
        fabricApiVersion   : '0.92.11+1.20.1',
        ftbLibraryVersion  : '2001.2.13',
        ftbEssentialsVersion: '2001.2.4',
        ftbLibraryRange    : '[2001.2.13,2002)',
        ftbEssentialsRange : '[2001.2.4,2002)',
        architecturyVersion: '9.0.8'
    ],
    '1.19.2': [
        javaVersion        : 17,
        minecraftRange     : '[1.19.2,1.19.3)',
        forgeVersion       : '43.5.2',
        forgeRange         : '[43.5.0,44)',
        fabricApiVersion   : '0.77.0+1.19.2',
        ftbLibraryVersion  : '1902.4.2-build.701',
        ftbEssentialsVersion: '1902.3.5-build.135',
        ftbLibraryRange    : '[1902.4.2-build.701,1903)',
        ftbEssentialsRange : '[1902.3.5-build.135,1903)',
        architecturyVersion: '6.5.69'
    ]
]

ext.targetMinecraft = providers.gradleProperty('mcVersion').getOrElse('1.20.1')
if (!profiles.containsKey(targetMinecraft)) {
    throw new GradleException("Unsupported -PmcVersion=${targetMinecraft}; expected one of ${profiles.keySet()}")
}
ext.profile = profiles[targetMinecraft]

subprojects {
    group = rootProject.mod_group_id
    version = rootProject.mod_version

    repositories {
        mavenCentral()
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.minecraftforge.net/' }
        exclusiveContent {
            forRepository { maven { url = 'https://maven.ftb.dev/releases' } }
            filter { includeGroup 'dev.ftb.mods' }
        }
        exclusiveContent {
            forRepository { maven { url = 'https://maven.architectury.dev/' } }
            filter { includeGroup 'dev.architectury' }
        }
    }

    plugins.withType(JavaPlugin).configureEach {
        java.toolchain.languageVersion = JavaLanguageVersion.of(rootProject.profile.javaVersion as int)
        tasks.withType(JavaCompile).configureEach {
            options.encoding = 'UTF-8'
            options.release = rootProject.profile.javaVersion as int
        }
    }

    tasks.withType(AbstractArchiveTask).configureEach {
        preserveFileTimestamps = false
        reproducibleFileOrder = true
    }
}

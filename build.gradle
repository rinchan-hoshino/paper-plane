import groovy.json.JsonSlurper

plugins {
    id 'fabric-loom' version '1.11.8' apply false
    id 'net.neoforged.moddev' version '2.0.91' apply false
}

def versionProfiles = new JsonSlurper().parse(file('gradle/version-profiles.json')) as Map<String, Map<String, ?>>
def selectedMinecraftVersion = findProperty("minecraft_version")?.toString() ?: '1.20.6'
if (!versionProfiles.containsKey(selectedMinecraftVersion)) {
    throw new GradleException("Unsupported minecraft_version '${selectedMinecraftVersion}'. Supported versions: ${versionProfiles.keySet().sort().join(', ')}")
}
ext.versionProfile = Collections.unmodifiableMap(new LinkedHashMap<>(versionProfiles[selectedMinecraftVersion]))

subprojects {
    group = rootProject.mod_group_id
    version = "${rootProject.mod_version}+${rootProject.versionProfile.minecraft_version}"

    repositories {
        mavenLocal()
        mavenCentral()
        maven { url = 'https://maven.neoforged.net/releases' }
        exclusiveContent {
            forRepository { maven { url = 'https://maven.fabricmc.net/' } }
            filter { includeGroupByRegex 'net\\.fabricmc(\\..*)?' }
        }
        exclusiveContent {
            forRepository { maven { url = 'https://maven.ftb.dev/releases' } }
            filter { includeGroup 'dev.ftb.mods' }
        }
        exclusiveContent {
            forRepository { maven { url = 'https://maven.architectury.dev/' } }
            filter { includeGroup 'dev.architectury' }
        }
    }

    plugins.withType(JavaPlugin).configureEach {
        java.toolchain.languageVersion = JavaLanguageVersion.of(rootProject.versionProfile.java_version as int)
        tasks.withType(JavaCompile).configureEach {
            options.encoding = 'UTF-8'
        }
    }
}
